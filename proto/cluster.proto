syntax = "proto3";

// Package notifier.cluster.v1 定义了集群节点间通信的完整有线协议。
// 包括信封包装、握手、事件复制、快照同步、时间同步、
// 对等发现和在线状态广播所需的所有消息类型。
package notifier.cluster.v1;

option go_package = "github.com/tursom/turntf/internal/proto;proto";

// Envelope 是所有集群节点间通信的通用信封。
// 包含发送节点标识、序列号、HLC时间戳以及HMAC签名。
message Envelope {
  // node_id 是发送此信封的节点标识。
  int64 node_id = 1;
  // sequence 是事件批次的全局序列号（仅事件批次使用）。
  uint64 sequence = 2;
  // sent_at_hlc 是发送时的混合逻辑时钟时间戳。
  string sent_at_hlc = 3;
  // body 是信封的具体内容，支持10种消息类型。
  oneof body {
    Hello hello = 4;
    Ack ack = 5;
    EventBatch event_batch = 6;
    PullEvents pull_events = 7;
    SnapshotDigest snapshot_digest = 8;
    SnapshotChunk snapshot_chunk = 9;
    TimeSyncRequest time_sync_request = 10;
    TimeSyncResponse time_sync_response = 11;
    MembershipUpdate membership_update = 17;
  }
  // hmac 是信封体的HMAC-SHA256签名，使用集群密钥计算。
  bytes hmac = 12;
}

// Hello 是会话建立时发送的握手消息。
// 交换节点标识、事件进度、快照版本和能力信息。
message Hello {
  int64 node_id = 1;
  // advertise_addr 是节点对外通告的WebSocket路径。
  string advertise_addr = 2;
  // protocol_version 是支持的协议版本。
  string protocol_version = 3;
  // origin_progress 是各原始节点的事件进度。
  repeated OriginProgress origin_progress = 4;
  // snapshot_version 是支持的快照版本。
  string snapshot_version = 5;
  // message_window_size 是每个事件流保留的最大事件数。
  uint32 message_window_size = 6;
  // connection_id 是此连接的标识符。
  uint64 connection_id = 8;
  // smoothed_rtt_ms 是指数平滑后的RTT值（毫秒）。
  uint32 smoothed_rtt_ms = 9;
  // jitter_penalty_ms 是RTT抖动惩罚值（毫秒）。
  uint32 jitter_penalty_ms = 10;
  // supports_membership 表示节点是否支持成员资格协议。
  bool supports_membership = 11;
  // runtime_epoch 是节点的运行时纪元。
  uint64 runtime_epoch = 12;
}

// OriginProgress 报告单个原始节点的事件复制进度。
message OriginProgress {
  int64 origin_node_id = 1;
  // last_event_id 是该原始节点的最新事件ID。
  uint64 last_event_id = 2;
}

// Ack 确认已成功应用到指定事件ID的所有事件。
message Ack {
  int64 node_id = 1;
  // origin_node_id 是事件原始产生的节点ID。
  int64 origin_node_id = 2;
  // acked_event_id 是已成功应用的最高事件ID。
  uint64 acked_event_id = 3;
}

// EventBatch 包含一个或多个待复制的事件。
// 也可用于Pull响应（通过pull_request_id关联请求）。
message EventBatch {
  repeated ReplicatedEvent events = 1;
  // pull_request_id 关联到PullEvents请求（非零表示此批次是Pull响应）。
  uint64 pull_request_id = 2;
  int64 origin_node_id = 3;
  // truncated_before_event_id 表示保留窗口已裁剪该ID之前的事件。
  uint64 truncated_before_event_id = 4;
}

// ReplicatedEvent 表示一个已复制到集群的存储事件。
// 使用oneof body支持10种事件类型。
message ReplicatedEvent {
  int64 event_id = 1;
  string aggregate_type = 2;
  int64 aggregate_node_id = 3;
  int64 aggregate_id = 4;
  // hlc 是事件发生时的混合逻辑时钟时间戳。
  string hlc = 5;
  int64 origin_node_id = 6;
  oneof body {
    UserCreatedEvent user_created = 7;
    UserUpdatedEvent user_updated = 8;
    UserDeletedEvent user_deleted = 9;
    MessageCreatedEvent message_created = 10;
    UserAttachmentUpsertedEvent user_attachment_upserted = 11;
    UserAttachmentDeletedEvent user_attachment_deleted = 12;
    UserMetadataUpsertedEvent user_metadata_upserted = 13;
    UserMetadataDeletedEvent user_metadata_deleted = 14;
    UserLoginNameUpsertedEvent user_login_name_upserted = 15;
    UserLoginNameDeletedEvent user_login_name_deleted = 16;
  }
}

// UserCreatedEvent 表示用户账户被创建。
message UserCreatedEvent {
  int64 node_id = 1;
  int64 user_id = 2;
  string username = 3;
  string password_hash = 4;
  string profile = 5;
  string role = 6;
  bool system_reserved = 7;
  string created_at_hlc = 8;
  string updated_at_hlc = 9;
  string version_username = 10;
  string version_password_hash = 11;
  string version_profile = 12;
  string version_role = 13;
  int64 origin_node_id = 14;
}

// UserUpdatedEvent 表示用户账户信息被更新。
message UserUpdatedEvent {
  int64 node_id = 1;
  int64 user_id = 2;
  string username = 3;
  string password_hash = 4;
  string profile = 5;
  string role = 6;
  bool system_reserved = 7;
  string created_at_hlc = 8;
  string updated_at_hlc = 9;
  string deleted_at_hlc = 10;
  string version_username = 11;
  string version_password_hash = 12;
  string version_profile = 13;
  string version_role = 14;
  string version_deleted = 15;
  int64 origin_node_id = 16;
}

// UserDeletedEvent 表示用户账户被删除。
message UserDeletedEvent {
  int64 node_id = 1;
  int64 user_id = 2;
  string deleted_at_hlc = 3;
}

// ClusterUserRef 唯一标识集群中的用户。
message ClusterUserRef {
  int64 node_id = 1;
  int64 user_id = 2;
}

// MessageCreatedEvent 表示一条消息被创建。
message MessageCreatedEvent {
  ClusterUserRef recipient = 1;
  int64 node_id = 3;
  int64 seq = 4;
  ClusterUserRef sender = 5;
  bytes body = 6;
  string created_at_hlc = 8;
}

// UserAttachmentUpsertedEvent 表示用户附件被创建或更新。
message UserAttachmentUpsertedEvent {
  ClusterUserRef owner = 1;
  ClusterUserRef subject = 2;
  string attachment_type = 3;
  string config_json = 4;
  string attached_at_hlc = 5;
  int64 origin_node_id = 6;
}

// UserAttachmentDeletedEvent 表示用户附件被删除。
message UserAttachmentDeletedEvent {
  ClusterUserRef owner = 1;
  ClusterUserRef subject = 2;
  string attachment_type = 3;
  string config_json = 4;
  string attached_at_hlc = 5;
  string deleted_at_hlc = 6;
  int64 origin_node_id = 7;
}

// UserMetadataUpsertedEvent 表示用户元数据被创建或更新。
message UserMetadataUpsertedEvent {
  ClusterUserRef owner = 1;
  string key = 2;
  bytes value = 3;
  string updated_at_hlc = 4;
  string expires_at = 5;
  int64 origin_node_id = 6;
}

// UserMetadataDeletedEvent 表示用户元数据被删除。
message UserMetadataDeletedEvent {
  ClusterUserRef owner = 1;
  string key = 2;
  string deleted_at_hlc = 3;
  int64 origin_node_id = 4;
}

// UserLoginNameUpsertedEvent 表示登录名被绑定到用户。
message UserLoginNameUpsertedEvent {
  string login_name = 1;
  int64 user_node_id = 2;
  int64 user_id = 3;
  string bound_at_hlc = 4;
  int64 origin_node_id = 5;
}

// UserLoginNameDeletedEvent 表示登录名与用户的绑定被删除。
message UserLoginNameDeletedEvent {
  string login_name = 1;
  int64 user_node_id = 2;
  int64 user_id = 3;
  string bound_at_hlc = 4;
  string deleted_at_hlc = 5;
  int64 origin_node_id = 6;
}

// PullEvents 请求从指定原始节点拉取事件。
message PullEvents {
  int64 origin_node_id = 1;
  // after_event_id 是已应用的最高事件ID，请求此ID之后的事件。
  uint64 after_event_id = 2;
  // limit 是最大返回事件数。
  uint32 limit = 3;
  // request_id 是此请求的唯一标识符。
  uint64 request_id = 4;
}

// SnapshotDigest 包含存储各分区状态的摘要信息。
// 用于快速检测节点间的状态分歧。
message SnapshotDigest {
  string snapshot_version = 1;
  repeated SnapshotPartitionDigest partitions = 2;
}

// SnapshotChunk 是单个快照分区的数据传输。
// request=true时表示请求分区数据；request=false时包含实际数据。
message SnapshotChunk {
  string partition = 1;
  repeated SnapshotRow rows = 2;
  string snapshot_version = 3;
  SnapshotPartitionKind kind = 4;
  // request 为true时表示请求分区数据而非携带数据。
  bool request = 5;
}

// SnapshotPartitionKind 是快照分区的类型枚举。
enum SnapshotPartitionKind {
  SNAPSHOT_PARTITION_KIND_UNSPECIFIED = 0;
  SNAPSHOT_PARTITION_KIND_USERS = 1;
  SNAPSHOT_PARTITION_KIND_MESSAGES = 2;
  SNAPSHOT_PARTITION_KIND_ATTACHMENTS = 3;
  SNAPSHOT_PARTITION_KIND_USER_METADATA = 4;
  SNAPSHOT_PARTITION_KIND_LOGIN_NAMES = 5;
}

// SnapshotPartitionDigest 是单个分区的摘要。
message SnapshotPartitionDigest {
  string partition = 1;
  SnapshotPartitionKind kind = 2;
  // row_count 是分区中的总行数。
  uint64 row_count = 3;
  // hash 是分区内容的SHA-256哈希。
  bytes hash = 4;
}

// SnapshotRow 是快照分区中的一行数据。
message SnapshotRow {
  oneof body {
    SnapshotUserRow user = 1;
    SnapshotTombstoneRow tombstone = 2;
    SnapshotMessageRow message = 3;
    SnapshotAttachmentRow attachment = 4;
    SnapshotUserMetadataRow user_metadata = 5;
    SnapshotLoginNameRow login_name = 6;
  }
}

// SnapshotUserRow 是快照中的用户行。
message SnapshotUserRow {
  int64 user_id = 1;
  int64 node_id = 16;
  string username = 2;
  string password_hash = 3;
  string profile = 4;
  string role = 13;
  bool system_reserved = 14;
  string created_at_hlc = 5;
  string updated_at_hlc = 6;
  string deleted_at_hlc = 7;
  string version_username = 8;
  string version_password_hash = 9;
  string version_profile = 10;
  string version_role = 15;
  string version_deleted = 11;
  int64 origin_node_id = 12;
}

// SnapshotTombstoneRow 是表示已删除实体的墓碑记录。
message SnapshotTombstoneRow {
  string entity_type = 1;
  int64 entity_id = 2;
  string deleted_at_hlc = 3;
  int64 origin_node_id = 4;
  int64 entity_node_id = 5;
}

// SnapshotMessageRow 是快照中的消息行。
message SnapshotMessageRow {
  ClusterUserRef recipient = 1;
  int64 node_id = 2;
  ClusterUserRef sender = 3;
  bytes body = 4;
  string created_at_hlc = 6;
  int64 seq = 7;
}

// SnapshotAttachmentRow 是快照中的附件行。
message SnapshotAttachmentRow {
  ClusterUserRef owner = 1;
  ClusterUserRef subject = 2;
  string attachment_type = 3;
  string config_json = 4;
  string attached_at_hlc = 5;
  string deleted_at_hlc = 6;
  int64 origin_node_id = 7;
}

// SnapshotUserMetadataRow 是快照中的用户元数据行。
message SnapshotUserMetadataRow {
  ClusterUserRef owner = 1;
  string key = 2;
  bytes value = 3;
  string updated_at_hlc = 4;
  string deleted_at_hlc = 5;
  string expires_at = 6;
  int64 origin_node_id = 7;
}

// SnapshotLoginNameRow 是快照中的登录名行。
message SnapshotLoginNameRow {
  string login_name = 1;
  int64 user_node_id = 2;
  int64 user_id = 3;
  string bound_at_hlc = 4;
  string deleted_at_hlc = 5;
  int64 origin_node_id = 6;
}

// TimeSyncRequest 是NTP风格时间同步的请求消息。
// 包含客户端发送时间（T1），服务器回复T2和T3，客户端记录T4。
message TimeSyncRequest {
  uint64 request_id = 1;
  // client_send_time_ms 是请求发起时客户端的物理时间（T1）。
  int64 client_send_time_ms = 2;
}

// TimeSyncResponse 是时间同步的响应消息。
message TimeSyncResponse {
  uint64 request_id = 1;
  int64 client_send_time_ms = 2;
  // server_receive_time_ms 是服务器接收请求的物理时间（T2）。
  int64 server_receive_time_ms = 3;
  // server_send_time_ms 是服务器发送响应的物理时间（T3）。
  int64 server_send_time_ms = 4;
}

// QueryLoggedInUsersRequest 查询目标节点上的已登录用户列表。
message QueryLoggedInUsersRequest {
  uint64 request_id = 1;
  int64 target_node_id = 2;
  int64 origin_node_id = 3;
  int32 remaining_hops = 4;
}

// QueryLoggedInUsersResponse 返回已登录用户列表。
message QueryLoggedInUsersResponse {
  uint64 request_id = 1;
  int64 target_node_id = 2;
  repeated ClusterLoggedInUser items = 3;
  string error_code = 4;
  string error_message = 5;
  int64 origin_node_id = 6;
  int32 remaining_hops = 7;
}

// QueryResolveUserSessionsRequest 查询指定用户的在线会话。
message QueryResolveUserSessionsRequest {
  uint64 request_id = 1;
  int64 target_node_id = 2;
  int64 origin_node_id = 3;
  int32 remaining_hops = 4;
  ClusterUserRef user = 5;
}

// QueryResolveUserSessionsResponse 返回用户的在线会话列表。
message QueryResolveUserSessionsResponse {
  uint64 request_id = 1;
  int64 target_node_id = 2;
  repeated ClusterSessionRef items = 3;
  string error_code = 4;
  string error_message = 5;
  int64 origin_node_id = 6;
  int32 remaining_hops = 7;
  ClusterUserRef user = 8;
}

// ClusterLoggedInUser 表示集群中的一个已登录用户。
message ClusterLoggedInUser {
  int64 node_id = 1;
  int64 user_id = 2;
  string username = 3;
  string login_name = 4;
}

// ClusterSessionRef 引用集群中的用户会话。
message ClusterSessionRef {
  int64 serving_node_id = 1;
  string session_id = 2;
  string transport = 3;
  bool transient_capable = 4;
}

// ClusterOnlineNodePresence 表示一个用户的服务节点存在信息。
message ClusterOnlineNodePresence {
  ClusterUserRef user = 1;
  int64 serving_node_id = 2;
  int32 session_count = 3;
  string transport_hint = 4;
}

// OnlinePresenceUpdateMode 表示在线状态更新的应用方式。
enum OnlinePresenceUpdateMode {
  ONLINE_PRESENCE_UPDATE_MODE_UNSPECIFIED = 0;
  // DELTA 只修改本消息列出的用户；removed_users 是用户墓碑。
  ONLINE_PRESENCE_UPDATE_MODE_DELTA = 1;
  // AUTHORITATIVE_SHARD 完整替换 origin 对应分片，且不允许携带 removed_users。
  ONLINE_PRESENCE_UPDATE_MODE_AUTHORITATIVE_SHARD = 2;
}

// OnlinePresenceUpdate 是节点的增量在线状态或权威分片快照。
message OnlinePresenceUpdate {
  // origin_node_id 是产生状态的节点，必须与 mesh 包来源一致。
  int64 origin_node_id = 1;
  // generation 在同一个 (origin_node_id, runtime_epoch, shard_index) 内单调递增。
  uint64 generation = 2;
  // items 与 logged_in_users 按用户一一对应，表示 presence 和登录摘要 upsert。
  repeated ClusterOnlineNodePresence items = 3;
  // runtime_epoch 是发送节点的运行时纪元。
  uint64 runtime_epoch = 4;
  repeated ClusterLoggedInUser logged_in_users = 5;
  OnlinePresenceUpdateMode mode = 6;
  // shard_index 是确定性用户分片索引，当前 shard_count 固定为 16。
  uint32 shard_index = 7;
  uint32 shard_count = 8;
  // removed_users 仅用于 DELTA，删除该 origin 下对应用户的临时在线状态。
  repeated ClusterUserRef removed_users = 9;
}

// NodeConnectivityRumor 传播节点可能已断开连接的传闻。
message NodeConnectivityRumor {
  int64 target_node_id = 1;
  uint64 target_runtime_epoch = 2;
  int64 reporter_node_id = 3;
  uint64 reporter_runtime_epoch = 4;
  int64 observed_at_ms = 5;
  string reason = 6;
}

// MembershipUpdate 包含对等节点发现信息。
message MembershipUpdate {
  int64 origin_node_id = 1;
  uint64 generation = 2;
  // peers 是此节点已知的对等节点列表。
  repeated PeerAdvertisement peers = 3;
}

// PeerAdvertisement 广告一个已知的对等节点。
message PeerAdvertisement {
  int64 node_id = 1;
  string url = 2;
  uint64 generation = 3;
  int64 observed_at_unix_ms = 4;
  string zeromq_curve_server_public_key = 5;
}

// TransientPacket 是通过集群网格路由的瞬时消息包。
message TransientPacket {
  uint64 packet_id = 1;
  int64 source_node_id = 2;
  int64 target_node_id = 3;
  ClusterUserRef recipient = 4;
  ClusterUserRef sender = 6;
  bytes body = 7;
  ClusterDeliveryMode delivery_mode = 8;
  uint32 ttl_hops = 9;
  ClusterSessionRef target_session = 10;
}

// ClusterDeliveryMode 是瞬时消息的投递模式。
enum ClusterDeliveryMode {
  CLUSTER_DELIVERY_MODE_UNSPECIFIED = 0;
  // BEST_EFFORT 尽最大努力投递，不重试。
  CLUSTER_DELIVERY_MODE_BEST_EFFORT = 1;
  // ROUTE_RETRY 失败时排队重试。
  CLUSTER_DELIVERY_MODE_ROUTE_RETRY = 2;
}
